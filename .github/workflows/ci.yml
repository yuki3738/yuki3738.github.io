name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler: latest

      - name: Install dependencies
        run: bundle update

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Check HTML
        run: |
          bundle exec htmlproofer ./_site \
            --ignore-urls "/twitter.com/,/x.com/,/fonts.googleapis.com/,/fonts.gstatic.com/" \
            --no-enforce-https \
            --ignore-missing-alt \
            --ignore-status-codes "999,429,403"
